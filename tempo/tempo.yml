server:
  http_listen_port: 3200
compactor:
  compaction:
    compaction_window: 1h
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
distributor:
  log_received_spans:
    enabled: true
  receivers:
    otlp:
      protocols:
        # Bind IPv6 ([::]) so the OTLP receivers are reachable over Railway's
        # IPv6-only private network (e.g. from the Tempo proxy at
        # tempo.railway.internal). 0.0.0.0 binds IPv4 only and is unreachable
        # internally, which made every proxied /v1/traces POST time out -> 502.
        grpc:
          endpoint: "[::]:4317"
        http:
          endpoint: "[::]:4318"
query_frontend:
  max_outstanding_per_tenant: 100
  search:
    max_duration: 720h
querier:
  max_concurrent_queries: 20
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: railway
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus.railway.internal:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
    span_metrics:
      histogram_buckets: [0.002, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]

# Enable the metrics-generator processors per-tenant. Without this block the
# generator stays idle no matter what is configured above.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
